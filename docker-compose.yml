services:
  api-monitor:
    build:
      context: .
      dockerfile: Dockerfile.api-monitor
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      CATALOG_INTERNAL_URL: http://catalog:8787
      API_MONITOR_KEY: ${API_MONITOR_KEY:-}
      API_MONITOR_PROVIDER_ALLOWLIST: ${API_MONITOR_PROVIDER_ALLOWLIST:-}
      API_PROBE_INTERVAL_MS: ${API_PROBE_INTERVAL_MS:-14400000}
      API_INFERENCE_INTERVAL_MS: ${API_INFERENCE_INTERVAL_MS:-86400000}
      API_INFERENCE_TIMEOUT_MS: ${API_INFERENCE_TIMEOUT_MS:-45000}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_PROBE_MODEL: ${DOUBAO_PROBE_MODEL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.minimaxi.com/v1}
      MINIMAX_SUBSCRIPTION_KEY: ${MINIMAX_SUBSCRIPTION_KEY:-}
      MINIMAX_PROBE_MODEL: ${MINIMAX_PROBE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PROBE_MODEL: ${OPENAI_PROBE_MODEL:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_PROBE_MODEL: ${PERPLEXITY_PROBE_MODEL:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_PROBE_MODEL: ${MOONSHOT_PROBE_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_PROBE_MODEL: ${GEMINI_PROBE_MODEL:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
  task-postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TASK_POSTGRES_DB:-tableai_tasks}
      POSTGRES_USER: ${TASK_POSTGRES_USER:-tableai_tasks}
      POSTGRES_PASSWORD: ${TASK_POSTGRES_PASSWORD:?Set TASK_POSTGRES_PASSWORD in .env.docker}
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 256
    mem_limit: ${TASK_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${TASK_POSTGRES_CPU_LIMIT:-1.0}

  task-valkey:
    image: valkey/valkey:8-bookworm
    user: "999:999"
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "${TASK_VALKEY_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ["/data:uid=999,gid=999,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: ${TASK_VALKEY_MEMORY_LIMIT:-320m}
    cpus: ${TASK_VALKEY_CPU_LIMIT:-0.5}

  task-core:
    build:
      context: .
      dockerfile: Dockerfile.task-core
      platforms: ["linux/amd64"]
    platform: linux/amd64
    image: tableai-task-core:local
    restart: unless-stopped
    ports:
      - "${TASK_CORE_BIND_ADDRESS:-127.0.0.1}:${TASK_CORE_PORT:-8790}:8790"
    depends_on:
      task-postgres: { condition: service_healthy }
      task-valkey: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${TASK_POSTGRES_USER:-tableai_tasks}:${TASK_POSTGRES_PASSWORD}@task-postgres:5432/${TASK_POSTGRES_DB:-tableai_tasks}
      REDIS_URL: redis://task-valkey:6379
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?Set SESSION_SIGNING_KEY in .env.docker}
      TASK_CORE_INTERNAL_TOKEN: ${TASK_CORE_INTERNAL_TOKEN:?Set TASK_CORE_INTERNAL_TOKEN in .env.docker}
      TASK_ENCRYPTION_KEY: ${TASK_ENCRYPTION_KEY:?Set TASK_ENCRYPTION_KEY in .env.docker}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-tableai}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-TableAI Catalog}
      POSTGRES_POOL_SIZE: ${TASK_POSTGRES_POOL_SIZE:-20}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${TASK_CORE_MEMORY_LIMIT:-768m}
    cpus: ${TASK_CORE_CPU_LIMIT:-1.0}

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    image: tableai-catalog:local
    restart: unless-stopped
    depends_on:
      task-core: { condition: service_healthy }
    ports:
      - "${TABLEAI_BIND_ADDRESS:-127.0.0.1}:${TABLEAI_PORT:-8787}:8787"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env.docker or the shell}
      API_KEY_SALT: ${API_KEY_SALT:?Set API_KEY_SALT in .env.docker or the shell}
      APP_NAME: ${APP_NAME:-tableai-catalog}
      ENVIRONMENT: ${ENVIRONMENT:-self-hosted}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      STATUS_PAGE_TITLE: ${STATUS_PAGE_TITLE:-TableAI catalog status}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CONTENT_ENCRYPTION_KEY: ${CONTENT_ENCRYPTION_KEY:?Set CONTENT_ENCRYPTION_KEY in .env.docker or the shell}
      CONTENT_KEY_VERSION: ${CONTENT_KEY_VERSION:-v1}
      INTERNAL_MONITOR_TOKEN: ${INTERNAL_MONITOR_TOKEN:?Set INTERNAL_MONITOR_TOKEN in .env.docker or the shell}
      LOCAL_SCAN_ROOT: ${LOCAL_SCAN_ROOT:-/Users/af/cpro01}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?Set SESSION_SIGNING_KEY in .env.docker}
      TASK_CORE_URL: http://task-core:8790
      TASK_CORE_INTERNAL_TOKEN: ${TASK_CORE_INTERNAL_TOKEN:?Set TASK_CORE_INTERNAL_TOKEN in .env.docker}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - tableai_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${TABLEAI_MEMORY_LIMIT:-1g}
    cpus: ${TABLEAI_CPU_LIMIT:-1.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-api:
    build:
      context: .
      dockerfile: Dockerfile.docker-proxy
      platforms:
        - linux/amd64
    platform: linux/amd64
    image: tableai-docker-readonly-proxy:local
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2375/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  asset-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
      platforms:
        - linux/amd64
    platform: linux/amd64
    image: tableai-catalog-sync:local
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
      docker-api:
        condition: service_started
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env.docker or the shell}
      SCANNER_KEY: ${SCANNER_KEY:-}
      WORKER_URL: http://catalog:8787
      SCANNER_POLL_SECONDS: ${SCANNER_POLL_SECONDS:-60}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-14400}
      SYNC_TIMEOUT_SECONDS: ${SYNC_TIMEOUT_SECONDS:-2700}
      ASSET_DISCOVERY_PROVIDERS: ${ASSET_DISCOVERY_PROVIDERS:-tencent,github,docker,cloudflare,godaddy,ens,solana}
      ASSET_DISCOVERY_OUTPUT: /data/assets/latest.json
      DOCKER_API_URL: http://docker-api:2375
      DOCKER_SERVER_ID: ${DOCKER_SERVER_ID:-db6ae7af-e560-47a4-a3e0-5d51e81f7eb8}
      NGINX_CONFIG_DIR: /nginx
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_REGION: ${TENCENT_REGION:-ap-guangzhou}
      TENCENT_REGIONS: ${TENCENT_REGIONS:-ap-guangzhou,ap-nanjing,ap-singapore}
      TENCENT_RUNTIME_DISCOVERY_ENABLED: ${TENCENT_RUNTIME_DISCOVERY_ENABLED:-true}
      TENCENT_RUNTIME_COMMAND_TIMEOUT: ${TENCENT_RUNTIME_COMMAND_TIMEOUT:-45}
      TENCENT_RUNTIME_POLL_TIMEOUT_MS: ${TENCENT_RUNTIME_POLL_TIMEOUT_MS:-120000}
      DNS_PROBE_ENABLED: ${DNS_PROBE_ENABLED:-true}
      DNS_PROBE_BATCH_SIZE: ${DNS_PROBE_BATCH_SIZE:-40}
      DNS_PROBE_CONCURRENCY: ${DNS_PROBE_CONCURRENCY:-6}
      DNS_PROBE_TIMEOUT_MS: ${DNS_PROBE_TIMEOUT_MS:-4000}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      GODADDY_API_TOKEN: ${GODADDY_API_TOKEN:-}
      GODADDY_ACCOUNT_ID: ${GODADDY_ACCOUNT_ID:-default}
      ENS_RPC_URL: ${ENS_RPC_URL:-}
      ENS_NAMES: ${ENS_NAMES:-}
      SOL_NAMES: ${SOL_NAMES:-}
    volumes:
      - tableai_data:/data
      - /etc/nginx/sites-enabled:/nginx:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /home/node:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${TABLEAI_SYNC_MEMORY_LIMIT:-512m}
    cpus: ${TABLEAI_SYNC_CPU_LIMIT:-0.75}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const exists=p=>{try{return fs.statSync(p)}catch{return null}};const success=exists('/data/assets/last-success');const poll=exists('/data/assets/last-poll');const scanner=Boolean(process.env.SCANNER_KEY);const scanFresh=success&&Date.now()-success.mtimeMs<18000000;const pollFresh=poll&&Date.now()-poll.mtimeMs<300000;if((scanner&&pollFresh)||(!scanner&&scanFresh))process.exit(0);process.exit(1)",
        ]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  health-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
      platforms:
        - linux/amd64
    platform: linux/amd64
    image: tableai-catalog-monitor:local
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      WORKER_URL: http://catalog:8787
      INTERNAL_MONITOR_TOKEN: ${INTERNAL_MONITOR_TOKEN:?Set INTERNAL_MONITOR_TOKEN in .env.docker or the shell}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      MONITOR_TIMEOUT_MS: ${MONITOR_TIMEOUT_MS:-5000}
      MONITOR_CONCURRENCY: ${MONITOR_CONCURRENCY:-6}
    volumes:
      - tableai_data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const age=Date.now()-fs.statSync('/data/monitor/last-success').mtimeMs;process.exit(age<900000?0:1)",
        ]
      interval: 2m
      timeout: 10s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  tableai_data:
  task_postgres_data:
